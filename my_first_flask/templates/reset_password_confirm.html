{% extends "base.html" %}

{% block title %}Reset Password | Talent Khoj{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Set New Password</h2>
        <p class="auth-subtitle">Enter your new password below.</p>

        <form method="POST">
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input id="new_password" name="new_password" type="password" placeholder="At least 8 characters" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input id="confirm_password" name="confirm_password" type="password" placeholder="Confirm your new password" required>
            </div>
            <button type="submit" class="submit-btn">Reset Password</button>
        </form>

        <p class="auth-footer">Back to <a href="/login">Sign In</a></p>
    </div>
</div>
{% endblock %}
