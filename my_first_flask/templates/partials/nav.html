<nav>
    <a href="/">Home</a> |
    {% if session.get('user_id') %}
        <a href="/profile">
            <img src="https://ui-avatars.com/api/?name={{ session['user_name'] }}&size=30&rounded=true" alt="profile" width="30" height="30" style="border-radius:50%; vertical-align:middle;">
            {{ session['user_name'] }}
        </a>
    {% else %}
        <a href="/register">Register</a> |
        <a href="/login">Login</a>
    {% endif %}
</nav>
