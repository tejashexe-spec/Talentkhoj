{% extends "base.html" %}

{% block title %}Login | Talent Khoj{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Welcome back</h2>
        <p class="auth-subtitle">Sign in to your Talent Khoj account</p>

        {% if error %}
            <p class="form-error">{{ error }}</p>
        {% endif %}

        <form method="post" action="/login">
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" value="{{ form_data.email }}" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Password" required>
            </div>
            <p class="auth-helper"><a href="/reset-password">Forgot password?</a></p>
            <button type="submit" class="submit-btn">Sign In</button>
        </form>

        <p class="auth-footer">Don't have an account? <a href="/register">Register here</a></p>

        <hr>
        <a href="/login/google" class="submit-btn" style="display:block; text-align:center; text-decoration:none; background:#fff; color:#333; border:1.5px solid #ddd; margin-top:12px;">
            Sign in with Google
        </a>
    </div>
</div>
{% endblock %}
