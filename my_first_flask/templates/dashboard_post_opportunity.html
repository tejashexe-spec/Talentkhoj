{% extends "dashboard_base.html" %}
{% set active = "post" %}
{% block title %}Post Opportunity | Talent Khoj{% endblock %}
{% block content %}
<style>
    .post-card {
        background: white;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        border: 1px solid rgba(0, 0, 0, 0.05);
        max-width: 800px;
        margin: 0 auto;
    }

    .form-group {
        margin-bottom: 22px;
    }

    .form-group label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #334155;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 12px 16px;
        border: 1.5px solid #cbd5e1;
        border-radius: 10px;
        font-size: 14px;
        color: #1e293b;
        outline: none;
        font-family: inherit;
        background: #f8fafc;
        transition: all 0.25s ease;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        border-color: #2456ff;
        background: white;
        box-shadow: 0 0 0 4px rgba(36, 86, 255, 0.1);
    }

    .form-group textarea {
        resize: vertical;
        min-height: 150px;
    }

    .required-tag {
        color: #ef4444;
        margin-left: 2px;
    }

    .form-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
    }

    .btn-submit {
        background: #2456ff;
        color: white;
        border: none;
        padding: 14px 30px;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 4px 14px rgba(36, 86, 255, 0.3);
        width: 100%;
        margin-top: 10px;
    }

    .btn-submit:hover {
        background: #1848d8;
        transform: translateY(-2px);
    }
</style>

<div class="dashboard-header">
    <h1>Post Opportunity</h1>
    <p>Post a job, internship, or event for talented candidates to discover.</p>
</div>

<div class="post-card">
    <form action="/dashboard/post-opportunity" method="POST">
        
        <div class="form-group">
            <label for="title">Opportunity Title <span class="required-tag">*</span></label>
            <input type="text" id="title" name="title" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="opportunity_type">Type of Opportunity <span class="required-tag">*</span></label>
                <select id="opportunity_type" name="opportunity_type" required>
                    <option value="job">Job</option>
                    <option value="internship">Internship</option>
                    <option value="event">Event</option>
                </select>
            </div>
            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" name="location">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="salary">Compensation / Salary Range</label>
                <input type="text" id="salary" name="salary">
            </div>
            <div class="form-group">
                <label for="experience_level">Experience Level Required</label>
                <input type="text" id="experience_level" name="experience_level">
            </div>
        </div>

        <div class="form-group">
            <label for="skills_required">Key Skills Required (Comma-separated)</label>
            <input type="text" id="skills_required" name="skills_required">
        </div>

        <div class="form-group">
            <label for="apply_link">External Application Link</label>
            <input type="url" id="apply_link" name="apply_link">
        </div>

        <div class="form-group">
            <label for="description">Detailed Description <span class="required-tag">*</span></label>
            <textarea id="description" name="description" required></textarea>
        </div>

        <button type="submit" class="btn-submit">Publish Opportunity</button>
    </form>
</div>
{% endblock %}
