<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>{% block title %}TalentKhoj Admin{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Optional local CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/admin.css') }}">

    <style>
        .sidebar {
            min-height: 100vh;
            background: #111827;
            color: white;
            transition: all 0.2s ease;
            position: sticky;
            top: 0;
        }

        .sidebar a {
            color: #cbd5e1;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            margin-bottom: 4px;
            border-radius: 12px;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .sidebar a i {
            width: 24px;
            font-size: 1.2rem;
        }

        .sidebar a:hover {
            background: #1f2937;
            color: white;
            transform: translateX(4px);
        }

        .sidebar a.active {
            background: #2563eb;
            color: white;
            box-shadow: 0 4px 8px rgba(37,99,235,0.2);
        }

        .sidebar a.active:hover {
            background: #1d4ed8;
            transform: translateX(2px);
        }

        .sidebar h4 {
            font-weight: 700;
            margin-bottom: 1.8rem;
            padding-left: 8px;
            color: white;
            font-size: 1.3rem;
        }

        .main-content {
            min-height: 100vh;
            background: #f8f9fa;
        }

        .top-bar {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }

        .page-title {
            font-size: 1.75rem;
            font-weight: 600;
            color: #111827;
            margin: 0;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: #e5e7eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4b5563;
        }

        hr {
            border-color: #334155;
            opacity: 0.3;
            margin: 15px 0;
        }

        .card-metric {
            border-left: 5px solid #0d6efd;
            transition: transform 0.2s;
        }

        .card-metric:hover {
            transform: translateY(-3px);
        }

        @media (max-width: 768px) {
            .sidebar a span {
                font-size: 0.9rem;
            }

            .sidebar a {
                padding: 10px 12px;
            }

            .page-title {
                font-size: 1.25rem;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-3">

            <h4>TalentKhoj Admin</h4>

            <a href="{{ url_for('admin_dashboard') }}">
                <i class="fas fa-chart-line"></i>
                <span>Dashboard</span>
            </a>

            <a href="{{ url_for('admin_reports') }}">
                <i class="fas fa-flag"></i>
                <span>Reports</span>
            </a>

            <a href="{{ url_for('admin_users') }}">
                <i class="fas fa-users"></i>
                <span>Users</span>
            </a>

            <a href="{{ url_for('admin_verification') }}">
                <i class="fas fa-check-circle"></i>
                <span>Verification</span>
            </a>

            <a href="{{ url_for('admin_projects') }}">
                <i class="fas fa-briefcase"></i>
                <span>Projects</span>
            </a>

            <a href="{{ url_for('admin_settings') }}">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>

            <hr>

            <a href="{{ url_for('logout') }}">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>

        </div>

        <!-- Main Content -->
        <div class="col-md-10 main-content">

            <div class="top-bar d-flex justify-content-between align-items-center">

                <h1 class="page-title">
                    {% block page_title %}
                        Dashboard
                    {% endblock %}
                </h1>

                <div class="user-info">

                    <div class="text-end">
                        <strong>{{ current_user.username }}</strong>
                        <div class="text-muted small">
                            Administrator
                        </div>
                    </div>

                    <div class="user-avatar">
                        <i class="fas fa-user"></i>
                    </div>

                </div>

            </div>

            <div class="container-fluid">
                {% block content %}
                {% endblock %}
            </div>

        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

{% block extra_js %}{% endblock %}

</body>
</html>
