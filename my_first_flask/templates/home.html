{% extends "base.html" %}

{% block title %}Home | Talent Khoj{% endblock %}

{% block content %}
<h2>Welcome to Talent Khoj</h2>
{% if session.get('user_id') %}
    <p>Hello, {{ session['user_name'] }}!</p>
    <p><a href="{{ url_for('logout') }}">Logout</a></p>
{% else %}
    <p><a href="{{ url_for('register') }}">Register</a> | <a href="{{ url_for('login') }}">Login</a></p>
{% endif %}
{% endblock %}
