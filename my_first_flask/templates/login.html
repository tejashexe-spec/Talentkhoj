{% extends "base.html" %}

{% block title %}Login | Talent Khoj{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">

        <h2>Welcome back</h2>
        <p class="subtitle">Sign in to your Talent Khoj account</p>

        {% if error %}
            <p class="error-text" style="margin-bottom:16px;">{{ error }}</p>
        {% endif %}

        <form method="post" action="{{ url_for('login') }}">

            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" value="{{ form_data.email }}" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="submit-btn">Sign In</button>

        </form>

        <p class="auth-footer">
            Don't have an account? <a href="{{ url_for('register') }}">Register here</a>
        </p>

    </div>
</div>
{% endblock %}
