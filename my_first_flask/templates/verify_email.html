{% extends "base.html" %}

{% block title %}Verify Email | Talent Khoj{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Verify Email</h2>
        <p class="auth-subtitle">Enter your email to receive a fresh verification link.</p>

        <form onsubmit="return false;">
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="you@example.com" required>
            </div>
            <button type="button" class="submit-btn">Send Verification Link</button>
        </form>

        <p class="auth-footer">Already verified? <a href="/login">Sign In</a></p>
    </div>
</div>
{% endblock %}
